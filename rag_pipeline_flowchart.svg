<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2140" viewBox="0 0 1200 2140" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid RAG Assistant Pipeline</title>
  <desc id="desc">Google Material-inspired architecture flowchart for a hybrid RAG assistant.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#3c4043" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="llmBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.33" stop-color="#EA4335"/>
      <stop offset="0.66" stop-color="#FBBC04"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <style>
      .bg{fill:#f8f9fa}.card{fill:#fff;stroke:#e7e9ec;stroke-width:1.5;filter:url(#shadow)}
      .title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#202124}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#5f6368}
      .ct{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#202124}.cs{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#5f6368}
      .miniT{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#202124}.miniS{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#5f6368}
      .line{stroke:#c9cdd2;stroke-width:3;fill:none}.arrow{fill:#aeb4bc}
      .pill{fill:#fafafa;stroke:#e1e4e8}.pillT{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#5f6368}
      .badge{font:800 13px Inter,Segoe UI,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
      .out{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#202124;text-anchor:middle}
    </style>
  </defs>

  <rect class="bg" width="1200" height="2140" rx="28"/>
  <circle cx="120" cy="120" r="95" fill="#4285f4" opacity=".045"/><circle cx="1080" cy="210" r="130" fill="#34a853" opacity=".04"/>

  <!-- Header -->
  <rect x="443" y="48" width="314" height="34" rx="17" fill="#fff" stroke="#e5e7eb"/>
  <circle cx="472" cy="65" r="4" fill="#4285F4"/><circle cx="483" cy="65" r="4" fill="#EA4335"/><circle cx="472" cy="75" r="4" fill="#FBBC04"/><circle cx="483" cy="75" r="4" fill="#34A853"/>
  <text x="506" y="71" style="font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#5f6368;letter-spacing:1.4px">RETRIEVAL + GENERATION</text>
  <text x="600" y="132" class="title" text-anchor="middle">Hybrid RAG Assistant Pipeline</text>
  <text x="600" y="165" class="sub" text-anchor="middle">Guardrails → hybrid retrieval → reranking → evidence checks → grounded generation</text>

  <!-- user query -->
  <rect class="card" x="390" y="205" width="420" height="82" rx="18"/>
  <rect x="420" y="227" width="38" height="38" rx="11" fill="#e8f0fe"/><text x="439" y="247" class="badge" fill="#1a73e8">Q</text>
  <text x="600" y="242" class="ct" text-anchor="middle">USER QUERY</text><text x="600" y="266" class="cs" text-anchor="middle">Natural-language question enters the system</text>

  <path class="line" d="M600 287 V327"/><polygon class="arrow" points="594,321 606,321 600,330"/>

  <!-- guardrail -->
  <rect class="card" x="350" y="330" width="500" height="94" rx="18"/>
  <rect x="382" y="355" width="40" height="40" rx="11" fill="#e8f0fe"/><text x="402" y="376" class="badge" fill="#1a73e8">✓</text>
  <text x="620" y="365" class="ct" text-anchor="middle">Query Guardrail + Intent Router</text>
  <text x="620" y="390" class="cs" text-anchor="middle">Safety checks, query quality checks, intent classification</text>

  <!-- branch 1 -->
  <path class="line" d="M600 424 V454 H310 V474 M600 454 H890 V474"/>
  <rect class="card" x="120" y="474" width="380" height="110" rx="18"/>
  <rect x="150" y="500" width="38" height="38" rx="11" fill="#fce8e6"/><text x="169" y="520" class="badge" fill="#c5221f">!</text>
  <text x="315" y="511" class="ct" text-anchor="middle">Unsafe / Vague</text>
  <text x="315" y="537" class="cs" text-anchor="middle">Refuse unsafe requests or clarify weak queries</text>
  <rect x="253" y="551" width="124" height="23" rx="11.5" fill="#f1f3f4" stroke="#e4e6e9"/><text x="315" y="567" class="pillT" text-anchor="middle">REFUSE / CLARIFY</text>

  <rect class="card" x="700" y="474" width="380" height="110" rx="18"/>
  <rect x="730" y="500" width="38" height="38" rx="11" fill="#e6f4ea"/><text x="749" y="520" class="badge" fill="#188038">→</text>
  <text x="895" y="511" class="ct" text-anchor="middle">Answerable Query</text>
  <text x="895" y="537" class="cs" text-anchor="middle">Continue into the retrieval pipeline</text>
  <rect x="852" y="551" width="86" height="23" rx="11.5" fill="#f1f3f4" stroke="#e4e6e9"/><text x="895" y="567" class="pillT" text-anchor="middle">PROCEED</text>

  <path class="line" d="M895 584 V626"/><polygon class="arrow" points="889,620 901,620 895,629"/>

  <!-- preprocessing -->
  <rect class="card" x="690" y="630" width="410" height="86" rx="18"/>
  <rect x="720" y="654" width="38" height="38" rx="11" fill="#e0f2f1"/><text x="739" y="674" class="badge" fill="#0b7f7d">↺</text>
  <text x="910" y="665" class="ct" text-anchor="middle">Query Preprocessing</text>
  <text x="910" y="690" class="cs" text-anchor="middle">Normalize, clean, optionally rewrite</text>

  <!-- retrieval split -->
  <path class="line" d="M895 716 V746 H610 M895 746 H1040 M610 746 V772 M1040 746 V772"/>
  <rect class="card" x="435" y="772" width="350" height="100" rx="18"/>
  <rect x="463" y="796" width="38" height="38" rx="11" fill="#fef7e0"/><text x="482" y="816" class="badge" fill="#b06000">K</text>
  <text x="620" y="808" class="ct" text-anchor="middle">BM25 Search</text><text x="620" y="835" class="cs" text-anchor="middle">keyword-based retrieval</text>

  <rect class="card" x="865" y="772" width="300" height="100" rx="18"/>
  <rect x="892" y="796" width="38" height="38" rx="11" fill="#e8f0fe"/><text x="911" y="816" class="badge" fill="#1a73e8">V</text>
  <text x="1025" y="808" class="ct" text-anchor="middle">Vector Search</text><text x="1025" y="835" class="cs" text-anchor="middle">semantic retrieval</text>

  <!-- join -->
  <path class="line" d="M620 872 V902 H820 M1025 872 V902 H820 V928"/><polygon class="arrow" points="814,922 826,922 820,931"/>
  <rect class="card" x="570" y="932" width="500" height="92" rx="18"/>
  <rect x="600" y="957" width="38" height="38" rx="11" fill="#f0e9fb"/><text x="619" y="977" class="badge" fill="#7e57c2">R</text>
  <text x="835" y="966" class="ct" text-anchor="middle">Reciprocal Rank Fusion (RRF)</text>
  <text x="835" y="992" class="cs" text-anchor="middle">Merge lexical + semantic rankings</text>

  <path class="line" d="M820 1024 V1061"/><polygon class="arrow" points="814,1055 826,1055 820,1064"/>
  <rect class="card" x="660" y="1065" width="320" height="76" rx="18"/>
  <rect x="690" y="1084" width="42" height="38" rx="11" fill="#fef7e0"/><text x="711" y="1104" class="badge" fill="#b06000">15</text>
  <text x="840" y="1095" class="ct" text-anchor="middle">Top ~15 Chunks</text><text x="840" y="1118" class="cs" text-anchor="middle">candidate pool</text>

  <path class="line" d="M820 1141 V1179"/><polygon class="arrow" points="814,1173 826,1173 820,1182"/>
  <rect class="card" x="570" y="1183" width="500" height="90" rx="18"/>
  <rect x="600" y="1208" width="38" height="38" rx="11" fill="#e8f0fe"/><text x="619" y="1228" class="badge" fill="#1a73e8">⇅</text>
  <text x="835" y="1217" class="ct" text-anchor="middle">Cross-Encoder Reranker</text>
  <text x="835" y="1243" class="cs" text-anchor="middle">Precision score each query–chunk pair</text>

  <path class="line" d="M820 1273 V1311"/><polygon class="arrow" points="814,1305 826,1305 820,1314"/>
  <rect class="card" x="660" y="1315" width="320" height="76" rx="18"/>
  <rect x="690" y="1334" width="48" height="38" rx="11" fill="#e6f4ea"/><text x="714" y="1354" class="badge" fill="#188038">4–6</text>
  <text x="840" y="1345" class="ct" text-anchor="middle">Top 4–6 Chunks</text><text x="840" y="1368" class="cs" text-anchor="middle">final context set</text>

  <path class="line" d="M820 1391 V1429"/><polygon class="arrow" points="814,1423 826,1423 820,1432"/>
  <rect class="card" x="500" y="1433" width="640" height="120" rx="18"/>
  <rect x="530" y="1463" width="40" height="40" rx="11" fill="#f0e9fb"/><text x="550" y="1484" class="badge" fill="#7e57c2">E</text>
  <text x="830" y="1473" class="ct" text-anchor="middle">Evidence / Metadata Layer</text>
  <text x="830" y="1500" class="cs" text-anchor="middle">Final validation before generation</text>
  <rect class="pill" x="620" y="1515" width="120" height="24" rx="12"/><text x="680" y="1531" class="pillT" text-anchor="middle">conflict detection</text>
  <rect class="pill" x="752" y="1515" width="133" height="24" rx="12"/><text x="818" y="1531" class="pillT" text-anchor="middle">relevance threshold</text>
  <rect class="pill" x="897" y="1515" width="154" height="24" rx="12"/><text x="974" y="1531" class="pillT" text-anchor="middle">dates / versions</text>

  <path class="line" d="M820 1553 V1580 H330 M820 1580 H830 M820 1580 H1070 M330 1580 V1600 M830 1580 V1600 M1070 1580 V1600"/>
  <rect class="card" x="180" y="1600" width="300" height="92" rx="16"/><text x="330" y="1632" class="miniT" text-anchor="middle">Conflict Detection</text><text x="330" y="1656" class="miniS" text-anchor="middle">Spot contradictory evidence</text>
  <rect class="card" x="680" y="1600" width="300" height="92" rx="16"/><text x="830" y="1632" class="miniT" text-anchor="middle">Relevance Threshold</text><text x="830" y="1656" class="miniS" text-anchor="middle">Drop weak evidence</text>
  <rect class="card" x="990" y="1600" width="170" height="92" rx="16"/><text x="1075" y="1626" class="miniT" text-anchor="middle">Date / Version</text><text x="1075" y="1649" class="miniS" text-anchor="middle">Resolve currency</text><text x="1075" y="1666" class="miniS" text-anchor="middle">and applicability</text>

  <!-- Return to central -->
  <path class="line" d="M830 1692 V1730"/><polygon class="arrow" points="824,1724 836,1724 830,1733"/>
  <rect x="560" y="1734" width="540" height="96" rx="20" fill="#fff" stroke="url(#llmBorder)" stroke-width="4" filter="url(#shadow)"/>
  <rect x="590" y="1762" width="40" height="40" rx="11" fill="#f1f3f4"/><text x="610" y="1783" class="badge" fill="#3c4043">AI</text>
  <text x="850" y="1773" class="ct" text-anchor="middle">Local LLM / Gemini Free Plan</text>
  <text x="850" y="1800" class="cs" text-anchor="middle">Grounded generation using validated context only</text>

  <!-- outputs -->
  <path class="line" d="M830 1830 V1860 H655 M830 1860 H830 M830 1860 H1005 M655 1860 V1880 M830 1860 V1880 M1005 1860 V1880"/>
  <rect class="card" x="570" y="1880" width="170" height="64" rx="15"/><text x="655" y="1918" class="out">Answer</text>
  <rect class="card" x="745" y="1880" width="170" height="64" rx="15"/><text x="830" y="1918" class="out">Citations</text>
  <rect class="card" x="920" y="1880" width="170" height="64" rx="15"/><text x="1005" y="1918" class="out">Confidence</text>

  <path class="line" d="M830 1944 V1980"/><polygon class="arrow" points="824,1974 836,1974 830,1983"/>
  <rect class="card" x="545" y="1984" width="570" height="100" rx="18"/>
  <rect x="575" y="2010" width="40" height="40" rx="11" fill="#e0f2f1"/><text x="595" y="2031" class="badge" fill="#0b7f7d">⏱</text>
  <text x="850" y="2019" class="ct" text-anchor="middle">Token + Latency Logger</text>
  <text x="850" y="2046" class="cs" text-anchor="middle">Prompt / completion tokens · retrieval · reranking · generation · E2E latency</text>

  <text x="600" y="2110" style="font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#80868b" text-anchor="middle">README-friendly SVG companion · same architecture as the standalone HTML</text>
</svg>
