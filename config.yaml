corpus:
  data_dir: "data/raw"
  manifest: "data/raw/corpus_manifest.json"
  as_of_date: "2026-08-27"

chunking:
  tokenizer: "BAAI/bge-small-en-v1.5"
  target_tokens: 300
  max_tokens: 450
  min_tokens: 40
  overlap_tokens: 50
  preserve_sections: true
  preserve_tables: true

output:
  chunks_file: "data/processed/chunks.jsonl"

embedding:
  model: "BAAI/bge-small-en-v1.5"
  batch_size: 32

retrieval:
  vector_top_k: 15
  bm25_top_k: 15
  hybrid_top_k: 15
  neighbor_window: 1

index:
  faiss_path: "data/index/faiss.index"
  documents_path: "data/index/chunks.json"
